<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Acesso | SCMC{% endblock %}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main class="auth-page"><section class="auth-card"><a class="auth-brand" href="#"><span class="brand-mark">S</span><span>SCMC<small style="display:block;color:#8491a2;font:500 10px 'DM Sans';margin-top:3px">Central de suporte</small></span></a>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert {{ category }}"><span>{{ '✓' if category=='success' else '!' }}</span>{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</section></main></body></html>
