{% extends 'base.html' %}{% block title %}{{ 'Editar' if row else 'Novo' }} equipamento | SCMC{% endblock %}{% block content %}<div class="section-head"><div><span class="eyebrow">INVENTÁRIO</span><h1>{{ 'Editar equipamento' if row else 'Novo equipamento' }}</h1></div></div><form class="card form" method="post"><div class="grid2"><label>Patrimônio<input name="asset_tag" required value="{{ row.asset_tag if row else '' }}"></label><label>Tipo<input name="category" required placeholder="Notebook, desktop, impressora..." value="{{ row.category if row else '' }}"></label><label>Marca<input name="brand" required value="{{ row.brand if row else '' }}"></label><label>Modelo<input name="model" required value="{{ row.model if row else '' }}"></label><label class="wide">Localização<input name="location" required value="{{ row.location if row else '' }}"></label>{% if row %}<label>Status<select name="status">{% for status in ['Ativo','Em manutenção','Inativo'] %}<option {{ 'selected' if row.status==status }}>{{ status }}</option>{% endfor %}</select></label>{% endif %}</div><div class="form-actions"><a class="btn" href="{{ url_for('equipment') }}">Cancelar</a><button class="btn primary">Salvar equipamento</button></div></form>{% endblock %}
