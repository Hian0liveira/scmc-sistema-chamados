{% extends 'base.html' %}{% block title %}{{ 'Editar' if row else 'Novo' }} usuário | SCMC{% endblock %}{% block content %}<div class="section-head"><div><span class="eyebrow">CADASTROS</span><h1>{{ 'Editar usuário' if row else 'Novo usuário' }}</h1></div></div><form class="card form" method="post"><label>Nome completo<input name="name" required value="{{ row.name if row else '' }}"></label><label>E-mail<input name="email" type="email" required value="{{ row.email if row else '' }}"></label><label>Perfil<select name="role" required><option value="">Selecione</option>{% for role in ['Técnico','Solicitante'] %}<option {{ 'selected' if row and row.role==role }}>{{ role }}</option>{% endfor %}</select></label>{% if row %}<label class="check"><input type="checkbox" name="active" value="1" {{ 'checked' if row.active }}> Cadastro ativo</label>{% endif %}<div class="form-actions"><a class="btn" href="{{ url_for('users') }}">Cancelar</a><button class="btn primary">Salvar</button></div></form>{% endblock %}
