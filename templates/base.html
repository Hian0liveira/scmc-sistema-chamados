<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}SCMC{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header class="top"><a class="brand" href="{{ url_for('index') }}"><span class="logo">S</span><span>SCMC<small>Chamados de manutenção</small></span></a><nav><a href="{{ url_for('index') }}">Início</a><a href="{{ url_for('orders') }}">Ordens</a><a href="{{ url_for('equipment') }}">Equipamentos</a><a href="{{ url_for('users') }}">Usuários</a></nav></header><main class="wrap">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><footer>SCMC · Projeto acadêmico de Desenvolvimento de Software</footer></body></html>
